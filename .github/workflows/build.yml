name: 自动打包

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检查、自测、打包
        id: pack
        run: |
          ZIP=$(scripts/pack.sh "${GITHUB_SHA::7}" | tail -1)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: 上传到本次运行的产物
        uses: actions/upload-artifact@v4
        with:
          name: xhs-hunter-${{ steps.pack.outputs.version }}-${{ github.sha }}
          path: dist/xhs-hunter/

      # main 每次推送：刷新固定的“最新版”下载
      - name: 更新「最新版」
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: |
          cp "$ZIP" dist/xhs-hunter-latest.zip
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/xhs-hunter-latest.zip "$ZIP" \
            --prerelease --target "$GITHUB_SHA" \
            --title "最新版（自动打包）" \
            --notes "由 ${GITHUB_SHA::7} 自动打包。下载 xhs-hunter-latest.zip → 解压 → chrome://extensions 打开开发者模式 → 加载已解压的扩展程序 → 选解压出来的 xhs-hunter 文件夹。更新时解压覆盖原文件夹，再点扩展的「重新加载」。"

      # 推送 v1.2.3 这样的标签：发正式版本
      - name: 发布正式版本
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes
